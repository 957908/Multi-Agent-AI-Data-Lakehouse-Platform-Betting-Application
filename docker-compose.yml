services:
  postgres:
    image: ankane/pgvector:latest
    environment: { POSTGRES_USER: lakehouse, POSTGRES_PASSWORD: lakehouse, POSTGRES_DB: lakehouse }
    ports: ["5432:5432"]
    volumes: ["./backend/app/db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro"]
  kafka:
    image: bitnami/kafka:latest
    environment: { KAFKA_CFG_NODE_ID: 1, KAFKA_CFG_PROCESS_ROLES: broker, KAFKA_CFG_LISTENERS: PLAINTEXT://:9092, KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092 }
    ports: ["9092:9092"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment: { MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: minio123 }
    ports: ["9000:9000", "9001:9001"]
  nessie:
    image: ghcr.io/projectnessie/nessie:latest
    ports: ["19120:19120"]
  prometheus:
    image: prom/prometheus:latest
    volumes: ["./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: [.env.example]
    ports: ["8000:8000"]
    depends_on: [postgres, kafka]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 5
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    ports: ["5173:80"]
    depends_on: [backend]
